  description: >-
    Oracle Health Data Intelligence is a comprehensive platform that leverages advanced analytics and
    artificial intelligence to collect and analyze health data from various sources, including electronic
    health records, claims data, and patient-generated data. This platform enables healthcare organizations
    to gain valuable insights into patient populations, treatment outcomes, and healthcare trends, ultimately
    improving the quality of care and driving better patient outcomes. The public developer portal documents
    roughly sixty tenant-scoped REST APIs across the longitudinal record, data ingestion, analytics,
    consumer engagement and clinical intelligence, all reached through a per-region base URL of the form
    https://{tenant}.api.{region}.healtheintent.com/{api}/{version}/{resource}.
- aid: oracle-health-data-intelligence:oracle-health-data-intelligence-populations-api
  name: Oracle Health Data Intelligence Populations API
  description: >-
    The Populations API from Oracle Health Data Intelligence — population-scoped read access to a
    patient's aggregated allergy record within the longitudinal patient record. Two operations,
    listAllergies and getAllergy, both cursor-paginated and both returning protected health
    information. Authenticated with a system-account bearer token or two-legged OAuth 1.0a.
  humanURL: https://docs.healtheintent.com/api/v1/allergy/#allergy-api-v1
