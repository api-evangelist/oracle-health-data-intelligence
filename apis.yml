description: >-
  Oracle Health Data Intelligence, formerly Cerner HealtheIntent, is a tenant-scoped population
  health platform that aggregates data from electronic health records, claims, genomic sources and
  patient-generated data into a single longitudinal record per patient, then computes intelligence
  over it — registries, risk scores, hierarchical condition categories, quality measures and care
  plans. Its public developer portal documents roughly sixty REST APIs spanning the longitudinal
  record, data ingestion, analytics and syndication, consumer engagement and clinical intelligence.
  Access is business-to-business and customer-scoped: an Oracle system account is requested through
  the Cerner Central portal and granted per-API authorization in the Health Data Intelligence
  Console, authenticating with a bearer token or two-legged OAuth 1.0a. Oracle publishes no
  machine-readable contract, no SDKs and, by a documented and reasoned decision, no FHIR APIs for
  this platform.
