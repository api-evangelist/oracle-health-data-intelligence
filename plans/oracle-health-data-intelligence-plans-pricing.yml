description: >-
  Published plans and pricing for the Oracle Health Data Intelligence APIs. There are none. API
  access is an entitlement of the underlying Health Data Intelligence platform licence rather than
  a separately priced product, and Oracle publishes no public rate card, no tiers and no metered
  pricing for it. This file replaces a 2026-05-04 bulk scaffold that invented a Free/Pro tier
  structure with request quotas Oracle has never published.
