provider_statement:
  question: Is an additional license required to use the Health Data Intelligence APIs?
  quote: >-
    If you are already a Health Data Intelligence customer, no additional license, contract, or fee
    is required to use the APIs associated with the solutions you license. Note that if you are
    using the APIs to integrate with a third-party system, the vendor of that system may require
    licensing or fees for the integration.
  source: https://docs.healtheintent.com/
  observed: '2026-08-27'
access:
  gate: existing Health Data Intelligence customer
  path: >-
    Request a system account through the Cerner Central US or EU portal, naming an Oracle contact,
    then have an administrator grant that account per-API authorization in the Health Data
    Intelligence Console.
  contact: Oracle engagement leader, or a service record in eService
notes:
  - >-
    Because access is scoped to the solutions a customer already licenses, the effective "plan" for
    any given tenant is the set of Health Data Intelligence solutions in their contract, which is
    not public information.
  - >-
    plan_count is 0 as a measured fact about what the provider publishes, not as a placeholder.
