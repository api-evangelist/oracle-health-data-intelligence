    operation: POST /test-well-sms-configs
    api: Consumer Notifications API
    docs: https://docs.healtheintent.com/api/v1/consumer-notifications
    description: >-
      Sends a test SMS against a well SMS configuration. The only explicit test-mode operation
      found anywhere on the platform.
time_simulation:
